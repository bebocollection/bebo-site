<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffedf4" />
  <meta name="description" content="A little floral surprise for Bebo." />
  <title>For Bebo 💗 | A Little Surprise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap');
    :root { --pink:#ed548e; --dark:#8d214e; --rose:#c92e6d; --light:#fff5f9; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; min-height:100svh; display:grid; place-items:center; overflow-x:hidden; font-family:'DM Sans',Arial,sans-serif; color:#702747; background:radial-gradient(circle at 18% 12%,#fff 0,transparent 33%),radial-gradient(circle at 84% 78%,#ffd1e4 0,transparent 34%),linear-gradient(135deg,#ffe5ee,#f8b5d0 60%,#f8dbe9); }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background-image:radial-gradient(#fff8 1px,transparent 1px); background-size:27px 27px; opacity:.35; }
    .ambient { position:fixed; font-size:clamp(22px,3vw,38px); opacity:.35; pointer-events:none; animation:float 7s ease-in-out infinite; }
    .ambient.a { left:7%; top:13%; } .ambient.b { right:8%; top:20%; animation-delay:-2s; } .ambient.c { left:13%; bottom:13%; animation-delay:-4s; } .ambient.d { right:10%; bottom:14%; animation-delay:-1s; }
    main { position:relative; width:min(94vw,500px); margin:25px auto; padding:28px 20px 32px; border:1px solid #ffffffa8; border-radius:32px; text-align:center; background:linear-gradient(160deg,#ffffffb5,#fff4f5aa); box-shadow:0 25px 70px #9c225134, inset 0 1px 0 #fff; backdrop-filter:blur(12px); }
    .eyebrow { margin:0 0 4px; font-size:11px; font-weight:700; letter-spacing:.26em; text-transform:uppercase; color:#aa5278; }
    h1 { margin:0; font-family:'Great Vibes','Brush Script MT',cursive; font-size:clamp(62px,14vw,90px); line-height:1.15; font-weight:400; color:var(--dark); text-shadow:0 4px 20px #fff; }
    .subtitle { margin:0 0 14px; font-size:14px; color:#975772; }
    .gift-stage { height:280px; position:relative; display:grid; place-items:end center; isolation:isolate; }
    .halo { position:absolute; width:260px; height:240px; left:50%; top:15px; transform:translateX(-50%); border-radius:50%; background:radial-gradient(circle,#fff9d5a8 5%,#ffb7d165 45%,transparent 72%); filter:blur(6px); }
    .ground { position:absolute; bottom:9px; width:280px; height:24px; border-radius:50%; background:#9e2f6340; filter:blur(13px); }
    .gift { width:220px; height:170px; position:relative; margin-bottom:26px; filter:drop-shadow(0 16px 13px #ae30544c); }
    .box-body { position:absolute; width:200px; height:130px; bottom:0; left:10px; border-radius:9px 9px 17px 17px; background:linear-gradient(105deg,#e84d89 0%,#fd91b6 42%,#dd3579 100%); border:2px solid #ffffff75; box-shadow:inset -14px 0 22px #ac226c24, inset 12px 0 17px #fff4; z-index:3; }
    .box-body::before { content:""; position:absolute; top:0; bottom:0; left:86px; width:28px; background:linear-gradient(90deg,#a9245f,#fdd4a6 40%,#be3266); box-shadow:0 0 8px #fff5; }
    .box-body::after { content:"✦"; position:absolute; top:69px; left:calc(50% - 12px); color:#fff8d8; font-size:23px; text-shadow:0 0 7px #fff; }
    .lid { position:absolute; left:0; top:21px; height:50px; width:220px; border-radius:11px; z-index:5; background:linear-gradient(115deg,#ff94bc,#df3d82 75%,#ba245e); border:2px solid #fff7; box-shadow:0 7px 9px #8d214e2c; transform-origin:12% 80%; transition:transform 1.15s cubic-bezier(.2,.75,.18,1),opacity .5s ease; }
    .lid::before { content:""; position:absolute; left:94px; top:0; height:100%; width:28px; background:linear-gradient(90deg,#b92965,#ffe1b7,#b92965); }
    .bow { position:absolute; z-index:6; top:-12px; left:78px; width:65px; height:36px; transition:transform 1.15s cubic-bezier(.2,.75,.18,1),opacity .5s; transform-origin:-55px 65px; }
    .bow::before,.bow::after { content:""; position:absolute; top:0; height:35px; width:38px; background:linear-gradient(130deg,#ff8daf,#b22162); border:2px solid #ffd6df; }
    .bow::before { left:0; border-radius:7px 29px 7px 29px; transform:rotate(-15deg); } .bow::after { right:0; border-radius:29px 7px 29px 7px; transform:rotate(15deg); }
    .knot { position:absolute; z-index:7; left:calc(50% - 10px); top:8px; width:20px; height:20px; border-radius:8px; background:#f9a6c5; border:2px solid #ffe1e7; transition:transform 1.15s,opacity .5s; transform-origin:-90px 55px; }
    .bouquet { position:absolute; z-index:2; left:16px; bottom:50px; width:190px; height:170px; opacity:0; transform:translateY(85px) scale(.6); transition:transform 1.05s cubic-bezier(.18,.9,.25,1.2) .3s,opacity .5s .3s; }
    .flower { position:absolute; font-size:62px; filter:drop-shadow(0 3px 4px #971e5740); animation:sway 4s ease-in-out infinite; transform-origin:bottom center; }
    .flower.f1 { left:0; top:55px; transform:rotate(-25deg); } .flower.f2 { left:60px; top:0; font-size:76px; animation-delay:-1s; } .flower.f3 { right:0; top:60px; transform:rotate(23deg); animation-delay:-2s; } .flower.f4 { left:64px; top:76px; font-size:58px; animation-delay:-1.5s; }
    .leaf { position:absolute; font-size:45px; top:90px; } .leaf.l1 { left:14px; transform:rotate(-45deg); } .leaf.l2 { right:18px; transform:rotate(40deg); }
    .opened .lid,.opened .bow,.opened .knot { transform:translate(-25px,-113px) rotate(-17deg); opacity:.95; } .opened .bouquet { opacity:1; transform:translateY(-12px) scale(1); }
    .open-btn { position:relative; z-index:8; cursor:pointer; border:0; border-radius:999px; padding:14px 35px; font-size:16px; font-weight:700; color:white; background:linear-gradient(110deg,#a52060,#ee4c91); box-shadow:0 9px 22px #b72f6c5c,inset 0 1px 0 #fff8; transition:transform .2s,box-shadow .2s; }
    .open-btn:hover { transform:translateY(-3px); box-shadow:0 12px 25px #b72f6c70; } .open-btn:focus-visible { outline:3px solid #7b174b; outline-offset:4px; } .open-btn:disabled { cursor:default; opacity:.8; }
    .message { max-width:410px; margin:0 auto; overflow:hidden; max-height:0; opacity:0; transform:translateY(18px); transition:max-height .9s ease, opacity .8s ease,transform .8s ease,margin .8s ease; }
    .opened .message { max-height:270px; opacity:1; transform:translateY(0); margin-top:23px; }
    .message-card { padding:22px 18px; border-radius:20px; border:1.5px solid #f6afc9; background:linear-gradient(140deg,#fffefa,#fff0f4); box-shadow:0 9px 25px #ae356031; }
    .message-card .small { margin:0 0 6px; color:#b4527e; font-family:'Great Vibes','Brush Script MT',cursive; font-size:34px; }
    .message-card p:last-child { margin:0; font-size:clamp(20px,5.6vw,26px); line-height:1.45; font-weight:700; color:#8f1f50; }
    .footer { margin:22px 0 0; color:#b56c8a; font-size:11px; letter-spacing:.07em; }
    .particle { position:fixed; z-index:20; pointer-events:none; user-select:none; font-size:20px; animation:burst var(--duration,1.8s) ease-out forwards; }
    @keyframes burst { 0% { transform:translate(0,0) scale(.4) rotate(0deg); opacity:0; } 15% { opacity:1; } 100% { transform:translate(var(--dx),var(--dy)) scale(1.15) rotate(var(--rotation)); opacity:0; } }
    @keyframes sway { 50% { translate:0 -7px; rotate:3deg; } }
    @keyframes float { 50% { transform:translateY(-18px) rotate(9deg); } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <span class="ambient a" aria-hidden="true">🌸</span><span class="ambient b" aria-hidden="true">♡</span><span class="ambient c" aria-hidden="true">✦</span><span class="ambient d" aria-hidden="true">🌷</span>
  <main id="surprise">
    <p class="eyebrow">A little surprise for</p>
    <h1>Bebo ♡</h1>
    <p class="subtitle">A tiny gift with a special request...</p>
    <div class="gift-stage" aria-hidden="true">
      <div class="halo"></div><div class="ground"></div>
      <div class="gift">
        <div class="bouquet"><span class="leaf l1">🌿</span><span class="leaf l2">🌿</span><span class="flower f1">🌷</span><span class="flower f2">🌸</span><span class="flower f3">🌹</span><span class="flower f4">🌼</span></div>
        <div class="box-body"></div><div class="lid"></div><div class="bow"></div><div class="knot"></div>
      </div>
    </div>
    <button type="button" class="open-btn" id="openButton" aria-expanded="false" aria-controls="message">Open Kren ♡</button>
    <section class="message" id="message" aria-live="polite" aria-hidden="true">
      <div class="message-card"><p class="small">Just for you, Bebo</p><p>BEBO PLS VIDEO UPLOAD KRDIA KAREN PLS 💗</p></div>
    </section>
    <p class="footer">Made with appreciation, from a fan ✦</p>
  </main>
  <script>
    const button = document.getElementById('openButton');
    const surprise = document.getElementById('surprise');
    const message = document.getElementById('message');
    function flowersAndHearts() {
      const icons = ['🌸','🌷','💗','✨','🌹','💖'];
      const bounds = button.getBoundingClientRect();
      const x = bounds.left + bounds.width / 2;
      const y = bounds.top;
      for (let i = 0; i < 28; i++) {
        const particle = document.createElement('span');
        particle.className = 'particle';
        particle.textContent = icons[i % icons.length];
        particle.style.left = `${x}px`;
        particle.style.top = `${y}px`;
        particle.style.setProperty('--dx', `${(Math.random() - .5) * Math.min(window.innerWidth * .8, 460)}px`);
        particle.style.setProperty('--dy', `${-65 - Math.random() * 310}px`);
        particle.style.setProperty('--rotation', `${Math.random() * 240 - 120}deg`);
        particle.style.setProperty('--duration', `${1.3 + Math.random() * 1.4}s`);
        document.body.appendChild(particle);
        particle.addEventListener('animationend', () => particle.remove(), {once:true});
      }
    }
    button.addEventListener('click', () => {
      if (surprise.classList.contains('opened')) return;
      surprise.classList.add('opened');
      button.textContent = 'For You, Bebo 💗';
      button.setAttribute('aria-expanded', 'true');
      message.setAttribute('aria-hidden', 'false');
      flowersAndHearts();
    });
  </script>
</body>
</html>
