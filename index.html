<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0e21">
<title>For Bebo ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--pink:#ffc1d9;--cream:#ffe9ef;--gold:#f6cfac;--dark:#290e21}
*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font-family:'DM Sans',sans-serif;color:var(--cream);background:radial-gradient(ellipse at 50% 2%,#8234536b,transparent 54%),linear-gradient(145deg,#160a15,#3b172e 57%,#210b1b);overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 20%,#ffb0ca80 0 2px,transparent 3px),radial-gradient(circle at 80% 56%,#ffe0ab88 0 1px,transparent 3px);background-size:155px 178px,188px 213px;opacity:.4}
.page{position:relative;width:min(940px,calc(100% - 24px));margin:auto;min-height:100svh;padding:clamp(8px,2vh,18px) 0 12px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.7vh,16px)}
.brand{text-align:center;font:clamp(42px,7vh,66px)/.92 'Great Vibes',cursive;color:#ffe1e9;text-shadow:0 0 26px #fd79b48b;margin:0}.brand span{font:24px Arial,sans-serif;color:#ff9dbf}
.photos{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(5px,1.5vw,13px);max-height:29svh}
.photo{position:relative;min-width:0;aspect-ratio:4/5;max-height:29svh;border:1px solid #ffc1d9a6;padding:3px;border-radius:clamp(9px,1.5vw,20px);background:linear-gradient(145deg,#f7a6c9,#8b395b 55%,#49162f);box-shadow:0 8px 24px #09030bb8,0 0 15px #e46c9b36;overflow:hidden}
.photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;background:#673249}
.photo:before,.photo:after{position:absolute;z-index:2;font-size:clamp(13px,2.3vw,27px);text-shadow:0 2px 8px #5b1136;pointer-events:none}.photo:before{content:'✿';top:0;left:3px;color:#ffe2ea}.photo:after{content:'❀';right:4px;bottom:0;color:#ffb5d0}
.gift{position:relative;width:min(670px,100%);border:1px solid #fcaac777;border-radius:clamp(19px,3vw,30px);padding:clamp(13px,2.4vh,23px) 12px 17px;text-align:center;background:radial-gradient(ellipse at 50% 10%,#c3588852,transparent 70%),linear-gradient(150deg,#491b32d9,#250d1fef);box-shadow:0 16px 50px #10040fa0,inset 0 0 28px #f7aaca16}
.gift:before,.gift:after{content:'🌸';position:absolute;top:-14px;font-size:clamp(26px,5vw,45px);filter:drop-shadow(0 5px 8px #250715)}.gift:before{left:-5px}.gift:after{right:-5px}
.eyebrow{font-size:clamp(8px,1.2vw,10px);letter-spacing:.23em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
h2{font:clamp(23px,4vw,35px)/1.12 'Playfair Display',serif;font-weight:400;margin:0 0 5px}.lead{font-size:clamp(11px,1.8vw,13px);color:#f1c8d5;margin:0}
.present{position:relative;height:clamp(116px,19vh,172px);width:205px;max-width:100%;margin:0 auto 6px;filter:drop-shadow(0 14px 13px #13030f)}
.base{position:absolute;bottom:2px;left:28px;width:149px;height:69%;border-radius:7px 7px 14px 14px;background:linear-gradient(105deg,#b43f72,#f49aba 55%,#a62f65);box-shadow:inset 0 -12px 18px #7b1e4c66,0 0 20px #ed7eac50}.base:after{content:'';position:absolute;left:calc(50% - 10px);inset-block:0;width:20px;background:linear-gradient(90deg,#d9a867,#ffeac0,#d9a867)}
.lid{position:absolute;z-index:3;left:15px;top:26%;width:175px;height:30%;max-height:45px;border:2px solid #ffe1e5;border-radius:7px;background:linear-gradient(120deg,#ffcbdb,#e476a2 55%,#ac3768);transform-origin:12% 80%;transition:transform .8s ease,opacity .8s}.lid:after{content:'🎀';position:absolute;font-size:42px;left:64px;top:-34px}
.bouquet{position:absolute;z-index:1;left:20px;right:20px;top:9px;font-size:clamp(28px,5vh,42px);white-space:nowrap;letter-spacing:-9px;transform:translateY(48px) scale(.6);opacity:.25;transition:transform .8s .15s,opacity .8s .15s}.opened .lid{transform:translate(-23px,-66px) rotate(-21deg)}.opened .bouquet{transform:translateY(-10px) scale(.9);opacity:1}
.open-btn{cursor:pointer;border:1px solid #ffe3dc;border-radius:100px;padding:11px 30px;background:linear-gradient(100deg,#ab316a,#f18eb4,#ae316b);color:white;font:700 15px 'DM Sans',sans-serif;box-shadow:0 0 0 4px #ff96be24,0 7px 25px #e9579390;transition:transform .2s}.open-btn:hover{transform:translateY(-2px)}.open-btn:focus-visible{outline:3px solid white;outline-offset:4px}
.message{margin:12px auto 0;max-width:540px;background:linear-gradient(135deg,#fff3ed,#ffd2e1);color:#8a254e;border:3px double #df7ca5;border-radius:15px;padding:14px 13px;animation:appear .6s both}.message[hidden]{display:none}.message strong{display:block;font:clamp(19px,3.5vw,28px)/1.28 'Playfair Display',serif}.message small{display:block;margin-top:6px;color:#a44d71;font-size:11px}
.petal-layer{pointer-events:none;position:fixed;z-index:10;inset:0;overflow:hidden}.petal{position:absolute;top:-30px;font-size:19px;animation:fall linear forwards}@keyframes fall{to{transform:translate3d(var(--x),105vh,0) rotate(480deg);opacity:0}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
/* On narrow phones photos MUST remain in one horizontal row, never stack. */
@media(max-width:520px){.page{width:calc(100% - 18px);gap:9px}.brand{font-size:clamp(39px,7vh,56px)}.photos{gap:5px}.photo{padding:2px;border-radius:9px}.gift{padding:13px 8px 14px}.present{height:clamp(100px,18vh,146px)}.open-btn{padding:10px 25px}.message{padding:12px 9px}.message strong{font-size:clamp(18px,4.5vw,23px)}}
@media(max-height:690px){.page{gap:7px;padding-top:6px}.brand{font-size:38px}.photos{max-height:25svh}.photo{max-height:25svh}.gift{padding-top:10px;padding-bottom:11px}.present{height:110px}.lead{display:none}.message{margin-top:8px;padding:9px}.message strong{font-size:19px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="petal-layer" id="petals" aria-hidden="true"></div>
<main class="page">
  <h1 class="brand">Bebo <span>♡</span></h1>
  <section class="photos" aria-label="Four Bebo photos">
    <div class="photo"><img src="B1.png" alt="Bebo photo 1"></div>
    <div class="photo"><img src="B2.png" alt="Bebo photo 2"></div>
    <div class="photo"><img src="B5.png" alt="Bebo photo 3"></div>
    <div class="photo"><img src="B6.png" alt="Bebo photo 4"></div>
  </section>
  <section class="gift" aria-labelledby="giftTitle">
    <p class="eyebrow">A little surprise, just for you</p>
    <h2 id="giftTitle">A Flower Box For Bebo ♡</h2>
    <p class="lead">A little message is waiting inside...</p>
    <div class="present" id="present" aria-hidden="true"><div class="bouquet">🌷🌸🌹💐</div><div class="base"></div><div class="lid"></div></div>
    <button id="openBtn" class="open-btn" type="button" aria-expanded="false" aria-controls="message">Open Kren ♡</button>
    <div class="message" id="message" hidden role="status" aria-live="polite">
      <strong>BEBO PLS VIDEO UPLOAD KRDIA KAREN PLS 💗</strong>
      <small>Jab bhi aapka dil kare — your fans would love a new video!</small>
    </div>
  </section>
</main>
<script>
const button=document.querySelector('#openBtn');
button.addEventListener('click',()=>{
  document.querySelector('#present').classList.add('opened');
  document.querySelector('#message').hidden=false;
  button.textContent='Opened ♡';button.setAttribute('aria-expanded','true');button.disabled=true;
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    const petals=document.querySelector('#petals');
    for(let i=0;i<28;i++){
      const p=document.createElement('span');p.className='petal';
      p.textContent=['🌸','✿','🌷','💗'][Math.floor(Math.random()*4)];
      p.style.left=Math.random()*100+'%';p.style.setProperty('--x',(Math.random()*170-85)+'px');
      p.style.animationDuration=(2.8+Math.random()*3)+'s';p.style.animationDelay=Math.random()*.8+'s';
      petals.append(p);p.addEventListener('animationend',()=>p.remove());
    }
  }
});
</script>
</body>
</html>
